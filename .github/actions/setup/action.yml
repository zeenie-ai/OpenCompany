# Shared environment setup: Node, bun, Python, uv, CLI deps.
name: 'Setup OpenCompany Environment'
description: 'Setup Node.js, bun, Python, uv, and the supervisor CLI.'

inputs:
  node-version:
    description: 'Node.js version'
    default: '22'

runs:
  using: composite
  steps:
    # Reads the bun version from the root package.json "packageManager" pin.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    # Node is a CI-only convenience: bun runs vite / vitest / eslint on it
    # when present (their bins carry node shebangs), which sidesteps the
    # open bun-runtime bugs in vitest and eslint. Nothing shipped needs
    # Node: the sidecar, the plugin CLIs and the `company` shim run on bun.
    # (vite, vitest, eslint run on
    # node via shebang; bun is package manager + script runner only).
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
        # Explicitly disabled: release jobs carry publish credentials, and
        # several lanes never run a JS package manager, which also makes
        # post-job cache saves fail with Path Validation Error.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: false
    - name: Install supervisor CLI
      shell: bash
      run: uv pip install --system -e .
    # A Windows runner's C: drive is slow and D: is its working drive
    # (actions/runner-images#8755). bun and uv keep their package caches on
    # C: by default, so every install unpacked there and then copied each
    # file to the checkout on D:. RUNNER_TEMP is on D:, and from a cache
    # there both tools hardlink instead. This step is last because the CLI
    # install above goes to the hosted Python, which is on C:.
    - name: Package caches on the working drive (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "BUN_INSTALL_CACHE_DIR=${RUNNER_TEMP}/bun-cache" >> "$GITHUB_ENV"
        echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"
