# Dependency updates are MANUAL by policy (2026-09-12): no version-update
# PRs or security-update PRs. The repository's Dependabot security updates
# setting must also be disabled to enforce this policy; YAML alone cannot
# stop alert-triggered update attempts. Dependencies move with test runs:
#   JS   -> bump the range in the relevant package.json (or the top-level
#           `overrides` block for transitive pins), `bun install`,
#           `bun run audit:deps`, run tests
#   pip  -> `uv lock --upgrade-package <name>` in server/, `uv sync`, tests
# Alerts stay visible in the repository's Security tab, except for bun.lock,
# which GitHub cannot read: CI's `bun run audit:deps` covers the JS trees.
#
# These entries declare the intended updaters and suppress scheduled PRs.
# They do not guarantee routing of alert-triggered jobs: on 2026-10-06,
# GitHub still selected npm_and_yarn for desktop/sharp despite the Bun
# entry. That updater cannot modify bun.lock. Fix genuine alerts in the
# manifests and lockfiles, and disable automatic security PR attempts in
# repository settings rather than adding an incompatible npm lockfile.
#
# Turning Dependabot's security-update attempts off entirely is a repository
# setting (Settings > Code security > Dependabot), not something this file
# can do; see docs-internal/ci_cd.md "Dependency update policy".
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: bun
    directory: /desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  # server/ needs both entries. Because of server/uv.lock, Dependabot runs its
  # uv updater there, and while only the pip entry ignored updates it kept
  # opening security PRs (#140 to #142, 2026-09-30 and 10-01).
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
