# Reusable validation workflow. Called by ci.yml and release.yml.
# Jobs: build-and-lint (client build, lint, tests, JS dependency audit),
# backend-tests (cross-OS, with the pinned Temporal CLI), cli-tests,
# test-build-start (cross-OS build + start smoke test).

name: Predeploy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun install --frozen-lockfile
      - name: Architecture Mermaid syntax
        run: bun scripts/check_architecture_mermaid.mjs
      - run: bun run build
      - name: Lint client
        run: bun run --filter react-flow-client lint
      - name: TypeScript check
        run: bun run --filter react-flow-client typecheck
      - name: JS executor TypeScript check
        run: bun run --filter opencompany-nodejs-executor typecheck
      - name: Pi SDK contracts and TypeScript check
        run: |
          bun --cwd=server/pi run typecheck
          bun run test:pi
      - name: Frontend tests (vitest)
        run: bun run --filter react-flow-client test
      # GitHub's dependency graph cannot read bun.lock, so no Dependabot alert
      # covers the JS trees. Each lockfile is audited: the root, desktop/
      # (with its own Bun security patch) and server/pi, whose production
      # tree ships as the Pi runtime archive. The one ignored advisory is in
      # docs-internal/ci_cd.md. Test the desktop patch after a frozen install
      # because the audit cannot inspect its behavior.
      - name: Audit JS dependencies
        run: bun run audit:deps
      - name: Verify desktop cache security patch
        working-directory: desktop
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run test:security
      - name: Audit desktop JS dependencies
        working-directory: desktop
        run: bun run audit:deps
      - name: Audit Pi runtime JS dependencies
        working-directory: server/pi
        run: bun run audit:deps

  # The whole server suite runs on every OS the desktop app ships for, with
  # the Temporal CLI the app pins, so the real-server tests (TEMPORAL_TEST_CLI)
  # run instead of skipping.
  backend-tests:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      TEMPORAL_REQUIRE_NATIVE_REPLAY: "1"
      DEBUG: "false"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Replay tests run workflow code from older commits (git show).
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lockfile is current
        if: runner.os == 'Linux'
        working-directory: server
        # server/uv.lock is what the desktop build installs with --frozen;
        # a stale lock would ship a different dependency tree than CI tested.
        run: uv lock --check
      - name: Audit Python dependencies
        if: runner.os == 'Linux'
        working-directory: server
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project --output-file "${RUNNER_TEMP}/opencompany-audit.txt" > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip --no-deps -r "${RUNNER_TEMP}/opencompany-audit.txt"
      - name: Pinned Temporal CLI
        working-directory: server
        shell: bash
        # The app's own installer (server/config/temporal_cli.json, checked
        # against its SHA-256) into a throwaway data directory.
        env:
          DATA_DIR: ${{ runner.temp }}/opencompany-data
        run: |
          uv sync
          uv run python -c "import asyncio, os; from services.temporal._install import ensure_temporal_binaries; cli = asyncio.run(ensure_temporal_binaries())['temporal']; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write(f'TEMPORAL_TEST_CLI={cli}\n')"
      - name: N-1 Temporal replay and identity gate
        working-directory: server
        shell: bash
        run: |
          uv run python -c "import os; from pathlib import Path; from services.temporal._install import cli_pin, binary_versions; cli = Path(os.environ['TEMPORAL_TEST_CLI']); assert cli.is_file(); assert binary_versions(cli)['cli_version'] == cli_pin()['version']"
          uv run pytest tests/temporal/test_replay_corpus.py tests/temporal/test_workflow_identity_golden.py tests/temporal/test_run_graph_replay.py -v -p no:cacheprovider
      - name: pytest
        working-directory: server
        shell: bash
        # --durations ends the log with the slowest test phases, so a slow run
        # says where its time went (setup counts: a fixture can be the cost).
        run: |
          bun --cwd=pi install --frozen-lockfile
          bun --cwd=pi run build
          uv sync
          uv run pytest tests/ -v --durations=25

  cli-tests:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: pytest
        run: |
          uv pip install --system pytest pytest-asyncio pyyaml "markdown-it-py>=3"
          python -m pytest cli/tests/ -v

  test-build-start:
    name: Build + start (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run build

      # The TS7 compiler is a per-platform Go binary delivered through
      # optionalDependencies. The type-check gate runs on ubuntu only, so
      # without this the darwin-arm64 and win32-x64 binaries are installed
      # on every matrix run and never executed — a broken one would pass CI
      # and surface on a developer machine instead. `bun run tsc` resolves
      # strictly from the root node_modules/.bin (TS7) — never `bunx`,
      # which falls back to the npm registry.
      - name: TypeScript binary resolves on this platform
        run: bun run tsc --version

      - name: Pi packaged startup without workspace dependencies
        run: bun --cwd=server/pi run test:distribution

      - name: Test start (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          APP_PORT=$(grep -E '^PYTHON_BACKEND_PORT=' .env.template | cut -d= -f2)
          bun run start &
          PID=$!
          # Pass only if /health answers. A cold macOS runner can need well
          # over 30 s, so wait up to 90 s, and stop early if start exited.
          healthy=0
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -sf -m 5 "http://localhost:${APP_PORT}/health" > /dev/null 2>&1; then
              healthy=1
              break
            fi
            kill -0 "$PID" 2>/dev/null || break
            sleep 2
          done
          bun run stop || true
          if [ "$healthy" -ne 1 ]; then
            echo "FAILED: /health never answered on port ${APP_PORT}"
            exit 1
          fi

      - name: Test start (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $job = Start-Job -ScriptBlock { Set-Location $using:PWD; bun run start }
          Start-Sleep -Seconds 15
          if ($job.State -eq "Running") { Stop-Job $job; Remove-Job $job }
          else { Receive-Job $job; exit 1 }
