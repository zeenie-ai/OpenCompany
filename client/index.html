<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/opencompany-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Pre-paint theme. Applies the stored theme to <html> before the first
      paint so a light-theme user never sees a dark flash while the bundle
      loads. Read-only: ThemeProvider (src/contexts/ThemeContext.tsx) owns
      the key migrations and every later write. The two theme lists must
      match AVAILABLE_THEMES and DARK_FAMILY there; the
      contexts/__tests__/themePrePaint.test.ts test enforces it.

      Home (Normal mode) shows the base theme of the stored theme's family
      (src/app/ShellThemeProvider.tsx); the saved screen is read the way
      readStoredShellMode in src/store/useAppStore.ts reads it. With Normal
      mode turned off (VITE_NORMAL_MODE=false) the app corrects the theme
      on its first render.
    -->
    <script>
      (function () {
        var THEMES = ['light', 'dark', 'renaissance', 'greek', 'edo', 'steampunk', 'atomic', 'cyber', 'wasteland', 'rot', 'plague', 'surveillance'];
        var DARK_FAMILY = ['dark', 'cyber', 'wasteland', 'rot', 'surveillance', 'steampunk'];
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('opencompany-theme');
          if (stored === null) stored = localStorage.getItem('machinaos-theme');
          if (stored !== null && THEMES.indexOf(stored) !== -1) {
            theme = stored;
          } else {
            var legacy = localStorage.getItem('darkMode');
            if (legacy !== null) theme = legacy === 'false' ? 'light' : 'dark';
          }
        } catch (e) {
          // Storage blocked by browser policy: keep the default.
        }
        try {
          var shell = localStorage.getItem('ui_shell_mode');
          if (shell !== 'normal' && shell !== 'dev') shell = localStorage.getItem('ui_pro_mode') === 'true' ? 'dev' : 'normal';
          if (shell === 'normal') theme = DARK_FAMILY.indexOf(theme) !== -1 ? 'dark' : 'light';
        } catch (e) {
          // Storage blocked: the stored theme could not be read either.
        }
        var html = document.documentElement;
        html.setAttribute('data-theme', theme);
        if (DARK_FAMILY.indexOf(theme) !== -1) html.classList.add('dark');
      })();
    </script>
    <!--
      Theme typography. Each theme picks its display + body + mono via
      the --font-display / --font-body / --font-mono tokens. Loading
      these as `media="print" onload=...` defers the network cost so
      the default light/dark theme (system fonts via @fontsource-
      variable/geist bundled at build time) renders without blocking,
      and Renaissance + Cyber fonts swap in once their stylesheets land.

      Renaissance: Cinzel (display), Cormorant Garamond (body),
                   IM Fell English (mono / italic accents).
      Cyber:       Space Mono (display — design-handoff legibility
                   substitution for Major Mono Display), VT323 (body
                   fallback), JetBrains Mono (body + mono).
      Plague:      Cinzel (display — substitution for UnifrakturCook
                   blackletter), EB Garamond (body), Special Elite (mono).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400&family=Bevan&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Lato:wght@400;700&family=Pirata+One&family=Sawarabi+Mincho&family=Shippori+Mincho:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=VT323&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400&family=Bevan&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Lato:wght@400;700&family=Pirata+One&family=Sawarabi+Mincho&family=Shippori+Mincho:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=VT323&display=swap"
      />
    </noscript>
    <title>OpenCompany</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
