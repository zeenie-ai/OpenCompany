# electron-builder configuration for the OpenCompany desktop shell.
#
# What ships: the electron-vite output (asar) plus three resource trees
# copied verbatim outside the asar, because Python needs real files:
#   resources/app-root/   the backend sibling layout (server/, client/dist,
#                         .env.template, package.json, .opencompany/workflows)
#   resources/runtime/    uv, python, bun for THIS os/arch
# Both come from desktop/stage/ (scripts/stage.ts). The ${os}-${arch}
# macro selects the per-target runtime dir so one config serves every
# platform.
#
# macOS is signed ad-hoc (mac.identity "-"), which needs no certificate.
# Skipping signing (identity null, up to v0.3.1) shipped Electron's binaries
# with only their linker signatures and no sealed bundle, and macOS called
# the downloaded app damaged, with no way to open it (issue #154). An ad-hoc
# seal turns that into the usual first-launch approval. Hardened runtime and
# notarization stay off and Windows has no certificate; what a Developer ID
# build needs is in docs-internal/desktop_app.md ("Signing and updates").

appId: ai.zeenie.opencompany
productName: OpenCompany
copyright: Copyright (c) 2026 OpenCompany contributors
# Release file names say the OS in plain words (windows / macos / linux) and
# carry NO version: GitHub's releases/latest/download/<file> redirect only
# works for a name that is the same on every release, and the README links
# straight to these files. The version lives in the release tag and in the
# latest*.yml updater feeds (electron-updater compares the feed's version
# field, not file names). Each platform block sets its name; this is only
# the fallback.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

asar: true
files:
  - out/**
  - package.json

extraResources:
  - from: stage/app-root/
    to: app-root/
  - from: stage/runtime/${os}-${arch}/
    to: runtime/
  - from: ../LICENSE
    to: licenses/OpenCompany-LICENSE
  - from: stage/runtime/${os}-${arch}/bun/LICENSE.md
    to: licenses/Bun-LICENSE.md
  - from: stage/runtime/${os}-${arch}/python/LICENSE.txt
    to: licenses/Python-LICENSE.txt

publish:
  provider: github
  owner: zeenie-ai
  repo: OpenCompany
  releaseType: draft

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: ${productName}-windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: OpenCompany
  artifactName: ${productName}-windows-${arch}.${ext}

mac:
  category: public.app-category.productivity
  # Apple Silicon only. cryptography (49 and later) and dependency-injector
  # publish no Intel macOS wheels, so on an Intel Mac the first-launch
  # `uv sync` would have to compile them, which needs Rust and a C compiler.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip # required by electron-updater (Squirrel.Mac reads zips, not dmgs)
      arch: [arm64]
  icon: build/icon.png
  artifactName: ${productName}-macos-${arch}.${ext}
  identity: "-" # ad-hoc; see the header
  # The bundled runtimes keep the signatures they ship with: uv and bun are
  # signed and notarized by their makers, CPython by its linker. The app's
  # seal still covers every file under Resources by content hash (macOS
  # seals Contents/Resources as data), so re-signing them would only swap
  # uv's and bun's notarized signatures for ad-hoc ones.
  signIgnore:
    - "/Contents/Resources/(app-root|runtime)/"
  hardenedRuntime: false
  notarize: false
  darkModeSupport: true
dmg:
  artifactName: ${productName}-macos-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  artifactName: ${productName}-linux-${arch}.${ext}
  category: Office
  maintainer: OpenCompany contributors
  synopsis: Self-improving AI employees, running on your own computer
  description: OpenCompany desktop app. Bundles uv, Python and bun; provisions the backend on first launch.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
